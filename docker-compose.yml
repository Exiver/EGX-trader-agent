services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    volumes:
      - ./app:/app/app  # live-reload source without rebuilding the image
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - BACKEND_URL=http://api:8080  # Docker's internal network — service name resolves automatically
    depends_on:
      - api